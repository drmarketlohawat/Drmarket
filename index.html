<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DR Market Attendance | Premium Dashboard</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');

        :root {
            --bg-dark: #111827;
            --card-dark: #1f2937;
            --jk-green: #16a34a;
            --apollo-purple: #7e22ce;
            --apollo-orange: #f97316;
            --text-light: #f8fafc;
            --text-muted: #94a3b8;
            --border-dark: #374151;
        }

        body { 
            font-family: 'Inter', sans-serif; 
            background-color: var(--bg-dark); 
            margin: 0; 
            padding: 0;
            color: var(--text-light);
            background-image: radial-gradient(circle at top right, rgba(126, 34, 206, 0.1), transparent 40%),
                              radial-gradient(circle at top left, rgba(22, 163, 74, 0.05), transparent 40%);
        }

        /* --- PREMIUM HEADER --- */
        .top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #0f172a;
            padding: 12px 15px;
            border-bottom: 1px solid var(--border-dark);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        }

        .brand-jk {
            font-weight: 800;
            font-size: 14px;
            color: var(--text-light);
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .brand-jk span { color: var(--jk-green); font-size: 18px; }

        .brand-dr {
            text-align: center;
            font-weight: 800;
            font-size: 16px;
            letter-spacing: 1px;
        }
        .brand-dr span {
            display: block;
            font-size: 10px;
            color: var(--text-muted);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .brand-apollo {
            font-weight: 800;
            font-size: 15px;
            color: var(--text-light);
            text-align: right;
            line-height: 1;
        }
        .brand-apollo span {
            display: block;
            font-size: 8px;
            color: var(--apollo-purple);
            letter-spacing: 1.5px;
        }

        .container { 
            padding: 20px; 
            max-width: 460px; 
            margin: 0 auto; 
        }

        /* --- HERO TAGLINE --- */
        .hero-text {
            text-align: center;
            margin: 15px 0 25px 0;
            font-size: 26px;
            font-weight: 800;
            line-height: 1.2;
            color: var(--text-light);
        }
        .hero-text .highlight-orange { color: var(--apollo-orange); }
        .hero-text .highlight-purple { color: #a855f7; }

        /* --- CAMERA UI --- */
        .camera-box { 
            width: 100%; 
            height: 240px; 
            background: #000; 
            margin: 0 auto 15px auto; 
            border-radius: 16px; 
            overflow: hidden; 
            position: relative; 
            border: 2px solid var(--border-dark);
            box-shadow: 0 10px 25px rgba(249, 115, 22, 0.1);
        }
        
        .cam-badge-left {
            position: absolute;
            top: 12px;
            left: 12px;
            background: rgba(22, 163, 74, 0.2);
            color: #4ade80;
            font-size: 10px;
            font-weight: bold;
            padding: 4px 10px;
            border-radius: 20px;
            border: 1px solid rgba(74, 222, 128, 0.4);
            z-index: 10;
        }

        .cam-badge-right {
            position: absolute;
            top: 12px;
            right: 12px;
            background: rgba(248, 250, 252, 0.1);
            color: #cbd5e1;
            font-size: 10px;
            font-weight: bold;
            padding: 4px 10px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            z-index: 10;
        }

        video { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            transform: scaleX(-1); 
        }
        canvas { display: none; }

        /* --- DEALER BADGES --- */
        .dealership-badges {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
        }
        .badge-item {
            display: flex;
            align-items: center;
            gap: 6px;
            background: var(--card-dark);
            padding: 8px 16px;
            border-radius: 25px;
            border: 1px solid var(--border-dark);
            font-size: 12px;
            font-weight: 600;
            color: #e2e8f0;
        }

        /* --- INPUT & BUTTONS --- */
        .input-group { position: relative; margin-bottom: 16px; }
        input[type="text"] { 
            width: 100%; 
            padding: 16px 16px 16px 45px; 
            box-sizing: border-box; 
            border: 1px solid var(--border-dark); 
            border-radius: 12px; 
            font-size: 16px; 
            background-color: var(--bg-dark);
            color: var(--text-light);
        }
        input[type="text"]:focus {
            outline: none;
            border-color: var(--jk-green);
        }
        .input-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            fill: var(--text-muted);
            width: 18px;
            height: 18px;
        }
        
        button { 
            width: 100%; 
            padding: 16px; 
            cursor: pointer; 
            border: none; 
            border-radius: 12px; 
            font-weight: 800; 
            font-size: 16px; 
            transition: all 0.2s ease;
        }
        .btn-entry { 
            background-color: var(--jk-green); 
            color: #fff; 
            box-shadow: 0 4px 15px rgba(22, 163, 74, 0.3);
        }
        .btn-exit { 
            background-color: var(--apollo-orange); 
            color: #fff; 
            box-shadow: 0 4px 15px rgba(249, 115, 22, 0.3);
        }

        #result { font-size: 14px; text-align: center; margin: 15px 0; min-height: 20px; font-weight: 600; }
        
        /* --- HISTORY SECTION --- */
        .history-header {
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            margin-top: 30px;
            margin-bottom: 15px;
            border-bottom: 2px solid var(--apollo-orange);
            padding-bottom: 10px;
        }
        .history-header h2 { margin: 0; font-size: 20px; font-weight: 800; }

        .btn-action-group { display: flex; gap: 8px; }
        .btn-export { 
            background-color: rgba(126, 34, 206, 0.15); 
            color: #c084fc; 
            border: 1px solid rgba(126, 34, 206, 0.4);
            padding: 8px 14px; font-size: 12px; border-radius: 8px; width: auto; font-weight: 600;
        }
        .btn-clear { 
            background-color: rgba(239, 68, 68, 0.1); 
            color: #f87171; 
            border: 1px solid rgba(239, 68, 68, 0.3);
            padding: 8px 14px; font-size: 12px; border-radius: 8px; width: auto; font-weight: 600;
        }
        .btn-admin-view {
            background-color: #3b82f6;
            color: #fff;
            padding: 8px 14px; font-size: 12px; border-radius: 8px; width: auto; font-weight: 600;
        }

        #history { display: flex; flex-direction: column; gap: 12px; }

        .date-group {
            border: 1px solid var(--border-dark);
            border-radius: 12px;
            overflow: hidden;
            background: var(--card-dark);
        }
        .date-header {
            background: rgba(255,255,255,0.03);
            padding: 14px 16px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-dark);
        }
        .date-content { padding: 12px; display: flex; flex-direction: column; gap: 12px; background: var(--bg-dark); }
        .date-group.collapsed .date-content { display: none; }
        
        .entry { 
            background: var(--card-dark);
            border: 1px solid var(--border-dark);
            border-radius: 10px;
            padding: 12px; 
            display: flex; 
            flex-direction: column;
            gap: 12px; 
        }
        .entry-top { display: flex; align-items: center; gap: 14px; }
        .entry img { 
            width: 65px; height: 65px; object-fit: cover; 
            border-radius: 8px; border: 1px solid var(--border-dark); 
            transform: scaleX(-1); flex-shrink: 0;
        }
        .entry-details { font-size: 12px; color: #cbd5e1; line-height: 1.5; flex-grow: 1; }
        .entry-name-text { font-size: 16px; font-weight: 700; color: var(--text-light); margin-bottom: 3px; }

        .exit-section {
            background: rgba(249, 115, 22, 0.05);
            border-top: 1px dashed rgba(249, 115, 22, 0.2);
            padding-top: 10px; margin-top: 3px; font-size: 12px; display: flex; gap: 10px; align-items: center;
        }
        .exit-img { width: 45px !important; height: 45px !important; border: 1px solid rgba(249, 115, 22, 0.3) !important; }
        .no-data { text-align: center; color: var(--text-muted); font-size: 14px; padding: 30px 0; font-style: italic; }
        
        .view-mode-badge {
            font-size: 11px;
            background: rgba(59, 130, 246, 0.2);
            color: #60a5fa;
            padding: 3px 8px;
            border-radius: 12px;
            font-weight: 600;
            border: 1px solid rgba(59, 130, 246, 0.3);
        }
    </style>
</head>
<body>

<div class="top-nav">
    <div class="brand-jk"><span>⬟</span> JKcement</div>
    <div class="brand-dr">DR MARKET<span>Lohawat</span></div>
    <div class="brand-apollo">apollo<span>TYRES</span></div>
</div>

<div class="container">
    
    <div class="hero-text">
        Built Bigger,<br>
        <span class="highlight-orange">Built Stronger</span><br>
        with <span class="highlight-purple">Top Brands.</span>
    </div>

    <div class="camera-box">
        <div class="cam-badge-left">• LIVE TRACKING</div>
        <div class="cam-badge-right">🔒 SECURE LOCATION</div>
        <video id="video" autoplay playsinline></video>
    </div>
    <canvas id="canvas" width="320" height="240"></canvas>

    <div class="dealership-badges">
        <div class="badge-item">🏢 JK Cement Partner</div>
        <div class="badge-item">⭕ Apollo Tyres Dealer</div>
    </div>

    <div class="input-group">
        <svg class="input-icon" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5-4-8-4z"/></svg>
        <input type="text" id="worker" placeholder="Enter Worker Name" oninput="handleWorkerInput()">
    </div>

    <button id="actionBtn" class="btn-entry" onclick="handleAttendance()">Mark Entry</button>

    <p id="result"></p>

    <div class="history-header">
        <div style="display: flex; flex-direction: column; gap: 4px;">
            <h2>History</h2>
            <div id="viewModeBadge" class="view-mode-badge">🔒 Hidden Mode</div>
        </div>
        <div class="btn-action-group">
            <button class="btn-admin-view" onclick="unlockAdminView()">👁️ Admin</button>
            <button class="btn-export" onclick="exportToCSV()">📊 Export</button>
            <button class="btn-clear" onclick="clearHistory()">Clear</button>
        </div>
    </div>
    <div id="history"></div>

</div>

<script>
// 👉 🛜 APNI GOOGLE SHEET APP SCRIPT KA LINK YAHAN PASTE KAREIN
const GOOGLE_SHEET_URL = "YOUR_GOOGLE_SCRIPT_LINK"; 

let video = document.getElementById("video");
let canvas = document.getElementById("canvas");
let currentAttendanceData = [];
let isAdminMode = false;

// 🔒 APPROVED WORKERS LIST (Naye 10+ naam add kar diye hain, inhe kabhi bhi edit kar sakte ho)
const APPROVED_WORKERS = ["rakesh", "ramesh", "suresh", "amit", "ravi", "bhumi", "vikas", "anil", "sunil", "karan", "arjun", "rahul", "neha", "pooja"];

window.onload = function() {
    loadHistory();
    initCamera();
};

function initCamera() {
    if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
        navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: false })
        .then(function(stream) {
            video.srcObject = stream;
        })
        .catch(function(err) {
            console.error(err);
        });
    }
}

function loadHistory() {
    let saved = localStorage.getItem("dr_attendance_data");
    if (saved) {
        currentAttendanceData = JSON.parse(saved);
    }
    renderHistory();
}

function handleWorkerInput() {
    checkWorkerState();
    if(!isAdminMode) {
        renderHistory(); 
    }
}

function checkWorkerState() {
    let name = document.getElementById("worker").value.trim().toLowerCase();
    let btn = document.getElementById("actionBtn");

    if (name === "") {
        btn.className = "btn-entry";
        btn.innerText = "Mark Entry";
        return;
    }

    let ongoingRecord = currentAttendanceData.find(r => r.name.toLowerCase() === name && !r.exitTime);

    if (ongoingRecord) {
        btn.className = "btn-exit";
        btn.innerText = "Mark Exit";
    } else {
        btn.className = "btn-entry";
        btn.innerText = "Mark Entry";
    }
}

function unlockAdminView() {
    let password = prompt("एडमिन पासवर्ड डालें (Admin Password):");
    if (password === "DR@2016") {
        isAdminMode = true;
        document.getElementById("viewModeBadge").innerText = "🔓 Admin Mode (All Records)";
        document.getElementById("viewModeBadge").style.background = "rgba(22, 163, 74, 0.2)";
        document.getElementById("viewModeBadge").style.color = "#4ade80";
        renderHistory();
    } else if (password !== null) {
        alert("गलत पासवर्ड! (Access Denied)");
    }
}

function handleAttendance() {
    let workerInput = document.getElementById("worker");
    let name = workerInput.value.trim();
    let resultDiv = document.getElementById("result");

    if (name === "") {
        alert("कृपया वर्कर का नाम डालें!");
        return;
    }

    if (!APPROVED_WORKERS.includes(name.toLowerCase())) {
        resultDiv.style.color = "#ef4444";
        resultDiv.innerHTML = "❌ Error: आपका नाम लिस्ट में नहीं है!";
        alert("आपका नाम अप्रूव्ड लिस्ट में नहीं है।");
        return;
    }

    // 🎯 HINDI DEVANAGARI INSTRUCTIONS FOR FACE SCAN
    const challenges = ["कृपया मुस्कुराएं 😊", "बाईं ओर (LEFT) देखें ⬅️", "दाईं ओर (RIGHT) देखें ➡️"];
    const randomChallenge = challenges[Math.floor(Math.random() * challenges.length)];
    
    let userVerified = confirm("🔐 सुरक्षा जाँच (Anti-Cheat):\n\nकृपया कैमरा के सामने नीचे दिया गया एक्शन करें और उसके बाद ही 'OK' दबाएं:\n👉 " + randomChallenge);
    
    if(!userVerified) {
        resultDiv.style.color = "#ef4444";
        resultDiv.innerHTML = "❌ Verification Cancelled!";
        return;
    }

    resultDiv.style.color = "var(--apollo-purple)";
    resultDiv.innerHTML = "Processing secured logging...";

    let photoDataUrl = "";
    try {
        let context = canvas.getContext("2d");
        context.drawImage(video, 0, 0, 320, 240);
        photoDataUrl = canvas.toDataURL("image/jpeg");
    } catch(e) {
        photoDataUrl = "No Photo Loaded";
    }

    if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(function(position) {
            let lat = position.coords.latitude;
            let lon = position.coords.longitude;
            let now = new Date();
            let dateKey = now.toLocaleDateString('en-GB'); 
            let timeString = now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});

            fetch("https://nominatim.openstreetmap.org/reverse?format=json&lat=" + lat + "&lon=" + lon)
            .then(response => response.json())
            .then(data => {
                let place = data && data.display_name ? data.display_name : "GPS: " + lat.toFixed(4) + ", " + lon.toFixed(4);
                processState(name, dateKey, timeString, place, photoDataUrl);
                workerInput.value = ""; 
                handleWorkerInput();
            })
            .catch(err => {
                processState(name, dateKey, timeString, "Location Logged (API Offline)", photoDataUrl);
                workerInput.value = "";
                handleWorkerInput();
            });

        }, function(error) {
            let now = new Date();
            let dateKey = now.toLocaleDateString('en-GB');
            let timeString = now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
            processState(name, dateKey, timeString, "Location Permission Blocked", photoDataUrl);
            workerInput.value = "";
            handleWorkerInput();
        });
    }
}

function processState(name, dateKey, timeString, place, photoDataUrl) {
    let resultDiv = document.getElementById("result");
    let ongoingIndex = currentAttendanceData.findIndex(r => r.name.toLowerCase() === name.toLowerCase() && !r.exitTime);
    
    let currentStatus = "";

    if (ongoingIndex !== -1) {
        currentAttendanceData[ongoingIndex].exitTime = timeString;
        currentAttendanceData[ongoingIndex].exitPlace = place;
        currentAttendanceData[ongoingIndex].exitPhoto = photoDataUrl;
        currentStatus = "EXIT";
        
        resultDiv.style.color = "var(--apollo-orange)";
        resultDiv.innerHTML = "✓ " + name + " की EXIT लग गई है!";
    } else {
        let newRecord = {
            id: Date.now(), name: name, date: dateKey, entryTime: timeString,
            entryPlace: place, entryPhoto: photoDataUrl, exitTime: null, exitPlace: null, exitPhoto: null
        };
        currentAttendanceData.unshift(newRecord);
        currentStatus = "ENTRY";
        
        resultDiv.style.color = "var(--jk-green)";
        resultDiv.innerHTML = "✓ " + name + " की ENTRY लग गई है!";
    }

    localStorage.setItem("dr_attendance_data", JSON.stringify(currentAttendanceData));
    renderHistory();

    if(GOOGLE_SHEET_URL && GOOGLE_SHEET_URL !== "YOUR_GOOGLE_SCRIPT_LINK") {
        fetch(GOOGLE_SHEET_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                name: name,
                date: dateKey,
                status: currentStatus,
                time: timeString,
                place: place
            })
        }).catch(err => console.log("Cloud Network Error."));
    }
}

function renderHistory() {
    let historyDiv = document.getElementById("history");
    let typedName = document.getElementById("worker").value.trim().toLowerCase();

    if (currentAttendanceData.length === 0) {
        historyDiv.innerHTML = "<div class='no-data'>कोई रिकॉर्ड नहीं मिला (No history found).</div>";
        return;
    }

    let filteredData = [];
    if (isAdminMode) {
        filteredData = currentAttendanceData; 
    } else if (typedName !== "") {
        filteredData = currentAttendanceData.filter(r => r.name.toLowerCase() === typedName);
    }

    if (filteredData.length === 0) {
        if (typedName === "") {
            historyDiv.innerHTML = "<div class='no-data'>🔒 अपना इतिहास देखने के लिए ऊपर अपना नाम लिखें।</div>";
        } else {
            historyDiv.innerHTML = "<div class='no-data'>\"" + typedName + "\" के लिए कोई रिकॉर्ड नहीं मिला।</div>";
        }
        return;
    }

    let grouped = {};
    filteredData.forEach(record => {
        if (!grouped[record.date]) { grouped[record.date] = []; }
        grouped[record.date].push(record);
    });

    let html = "";
    Object.keys(grouped).forEach(date => {
        html += "<div class='date-group' id='group-" + date.replace(/\//g, '-') + "'>" +
                "  <div class='date-header' onclick='toggleDate(\"" + date.replace(/\//g, '-') + "\")'>" +
                "    📅 " + date + " (" + grouped[date].length + " Records)" +
                "  </div>" +
                "  <div class='date-content'>";

        grouped[date].forEach(record => {
            html += "<div class='entry'>" +
                    "  <div class='entry-top'>" +
                    "    <img src='" + record.entryPhoto + "' alt='Entry'>" +
                    "    <div class='entry-details'>" +
                    "       <div class='entry-name-text'>" + record.name + "</div>" +
                    "       <span style='color:var(--jk-green); font-size:11px; font-weight:bold;'>📥 ENTRY</span><br>" +
                    "       <strong>🕒 Time:</strong> " + record.entryTime + "<br>" +
                    "       <strong>🏠 Place:</strong> " + record.entryPlace + "" +
                    "    </div>" +
                    "  </div>";

            if (record.exitTime) {
                html += "  <div class='exit-section'>" +
                        "    <img class='exit-img' src='" + record.exitPhoto + "' alt='Exit'>" +
                        "    <div class='entry-details'>" +
                        "       <span style='color:var(--apollo-orange); font-size:11px; font-weight:bold;'>📤 EXIT</span><br>" +
                        "       <strong>🕒 Time:</strong> " + record.exitTime + "<br>" +
                        "       <strong>🏠 Place:</strong> " + record.exitPlace + "" +
                        "    </div>" +
                        "  </div>";
            } else {
                html += "  <div class='exit-section' style='background:rgba(255,255,255,0.02); border-top:1px dashed #374151; color:var(--text-muted); font-style:italic; font-size:11px;'>" +
                        "    ⚠️ मार्केट फील्ड पर हैं (Exit Pending)..." +
                        "  </div>";
            }
            html += "</div>";
        });

        html += "  </div></div>";
    });

    historyDiv.innerHTML = html;
}

function toggleDate(dateId) {
    let el = document.getElementById("group-" + dateId);
    if(el) el.classList.toggle("collapsed");
}

function exportToCSV() {
    let password = prompt("एक्सेल रिपोर्ट (Excel Report) डाउनलोड करने के लिए एडमिन पासवर्ड डालें:");
    if (password !== "DR@2016") {
        if (password !== null) alert("गलत पासवर्ड रवि के पास मैसेज गया! (Access Denied)");
        return;
    }

    if (currentAttendanceData.length === 0) {
        alert("एक्सपोर्ट करने के लिए कोई डेटा नहीं है!");
        return;
    }

    let csvContent = "data:text/csv;charset=utf-8,";
    csvContent += "Worker Name,Date,Entry Time,Entry Location,Exit Time,Exit Location\n";

    currentAttendanceData.forEach(r => {
        let name = r.name.replace(/,/g, " "); 
        let date = r.date;
        let eTime = r.entryTime;
        let ePlace = r.entryPlace.replace(/,/g, " "); 
        let xTime = r.exitTime ? r.exitTime : "Pending";
        let xPlace = r.exitPlace ? r.exitPlace.replace(/,/g, " ") : "Still Working";

        csvContent += `"${name}","${date}","${eTime}","${ePlace}","${xTime}","${xPlace}"\n`;
    });

    let encodedUri = encodeURI(csvContent);
    let link = document.createElement("a");
    link.setAttribute("href", encodedUri);
    link.setAttribute("download", `DR_Market_Attendance_${new Date().toLocaleDateString().replace(/\//g, '-')}.csv`);
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
}

function clearHistory() {
    let password = prompt("हिस्ट्री डिलीट करने के लिए एडमिन पासवर्ड डालें:");
    if (password === "DR@2016") { 
        if (confirm("क्या आप सच में सारी हिस्ट्री डिलीट करना चाहते हैं?")) {
            currentAttendanceData = [];
            localStorage.removeItem("dr_attendance_data");
            isAdminMode = false;
            document.getElementById("viewModeBadge").innerText = "🔒 Hidden Mode";
            document.getElementById("viewModeBadge").style.background = "rgba(59, 130, 246, 0.2)";
            document.getElementById("viewModeBadge").style.color = "#60a5fa";
            renderHistory();
            document.getElementById("result").innerHTML = "";
            alert("हिस्ट्री डिलीट हो गई है।");
        }
    } else if (password !== null) {
        alert("गलत पासवर्ड रवि के पास मैसेज गया!");
    }
}
